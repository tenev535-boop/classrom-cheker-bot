<title>Училищен дашборд</title>
<style>
/* Layout: one mobile column — clock, next class, schedule editor, notes filter */
:root {
  --bg: #0f1216; --surface: #171c22; --line: #262d36;
  --fg: #e6ebf0; --muted: #8a96a3; --accent: #7cc4a4; --warn: #e8b66b;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; }
.wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
.clock { text-align: center; padding-block: 8px; }
.time { font-family: var(--mono); font-size: clamp(56px, 20vw, 88px); font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.time .sec { color: var(--muted); font-size: 0.4em; margin-left: 4px; }
.date { color: var(--muted); margin-top: 8px; text-transform: capitalize; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.now-subject { font-size: 26px; font-weight: 600; text-wrap: balance; }
.meta { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .5s; }
.today { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.today li { display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.today li:first-child { border-top: 0; }
.today .t { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.today li.done { opacity: .45; }
.today li.cur .s { color: var(--accent); font-weight: 600; }
button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea, select { width: 100%; box-sizing: border-box; font: 14px/1.5 var(--mono); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
textarea { min-height: 150px; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.hits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.hits li { padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; overflow-wrap: anywhere; line-height: 1.45; }
mark { background: color-mix(in srgb, var(--warn) 30%, transparent); color: var(--fg); border-radius: 3px; padding: 0 2px; }
.empty { color: var(--muted); font-style: italic; }
@media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>

<div class="wrap">
  <header class="clock">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
  </header>

  <section aria-labelledby="h-next">
    <h2 id="h-next">Следващ час</h2>
    <div id="status"></div>
    <div class="now-subject" id="subject">—</div>
    <div class="meta" id="detail"></div>
    <div class="bar" id="barWrap" hidden><div id="bar"></div></div>
    <ul class="today" id="today"></ul>
  </section>

  <section aria-labelledby="h-sched">
    <h2 id="h-sched">Учебна програма</h2>
    <div class="row">
      <button type="button" id="toggleSched">Редактирай програмата</button>
    </div>
    <div id="schedEditor" hidden>
      <div class="row" style="margin-bottom:8px">
        <label for="daySel" class="hint">Ден:</label>
        <select id="daySel" style="width:auto"></select>
      </div>
      <textarea id="schedText" spellcheck="false"></textarea>
      <p class="hint">По един час на ред: <code>08:00 Математика</code>. Всеки час е 44 минути. Записва се автоматично.</p>
    </div>
  </section>

  <section aria-labelledby="h-notes">
    <h2 id="h-notes">Бележки и промени</h2>
    <div class="row">
      <button type="button" id="toggleNotes">Постави текст</button>
      <button type="button" id="clearNotes">Изчисти</button>
    </div>
    <div id="notesBox" hidden>
      <textarea id="notes" placeholder="Постави тук съобщение от класния, Viber, e-дневник…" spellcheck="false"></textarea>
    </div>
    <p class="hint">Показват се само редовете с „промяна“, „заместник“ или „кабинет“.</p>
    <ul class="hits" id="hits"></ul>
  </section>
</div>

<script>
(() => {
  const LESSON = 44;
  const DAYS = ["Неделя","Понеделник","Вторник","Сряда","Четвъртък","Петък","Събота"];
  const KEY = "school-dash-v1";
  // Примерна програма — редактирай я от секцията „Учебна програма“
  const SAMPLE = "07:30 Български език\n08:25 Математика\n09:20 Английски език\n10:25 История\n11:20 Физика\n12:15 Физическо възпитание";
  const $ = id => document.getElementById(id);

  let state = { sched: {}, notes: "" };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) state = Object.assign(state, s); } catch (e) {}
  for (let d = 1; d <= 5; d++) if (state.sched[d] == null) state.sched[d] = SAMPLE;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const pad = n => String(n).padStart(2, "0");
  const fmt = m => pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60);
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  function parse(text) {
    return (text || "").split("\n").map(l => l.trim().match(/^(\d{1,2})[:.](\d{2})\s+(.+)$/))
      .filter(Boolean).map(m => ({ start: +m[1] * 60 + +m[2], name: m[3] }))
      .sort((a, b) => a.start - b.start);
  }

  function render() {
    const now = new Date();
    $("time").innerHTML = pad(now.getHours()) + ":" + pad(now.getMinutes()) + '<span class="sec">' + pad(now.getSeconds()) + "</span>";
    $("date").textContent = now.toLocaleDateString("bg-BG", { weekday: "long", day: "numeric", month: "long" });

    const mins = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    const today = parse(state.sched[now.getDay()]);
    const cur = today.find(l => mins >= l.start && mins < l.start + LESSON);
    const next = today.find(l => l.start > mins);
    const st = $("status"), barWrap = $("barWrap");

    if (cur) {
      const left = Math.ceil(cur.start + LESSON - mins);
      st.innerHTML = '<span class="pill">В час · остават ' + left + " мин</span>";
      $("subject").textContent = next ? next.name : "Последен час за днес";
      $("detail").textContent = "Сега: " + cur.name + (next ? " · следва в " + fmt(next.start) : " · край в " + fmt(cur.start + LESSON));
      barWrap.hidden = false;
      $("bar").style.width = ((mins - cur.start) / LESSON * 100).toFixed(1) + "%";
    } else if (next) {
      const wait = Math.ceil(next.start - mins);
      st.innerHTML = '<span class="pill warn">' + (today[0] === next ? "Преди училище" : "Междучасие") + " · след " + wait + " мин</span>";
      $("subject").textContent = next.name;
      $("detail").textContent = fmt(next.start) + " – " + fmt(next.start + LESSON);
      barWrap.hidden = true;
    } else {
      // Намери първия час в следващ учебен ден
      let found = null;
      for (let i = 1; i <= 7 && !found; i++) {
        const d = (now.getDay() + i) % 7, l = parse(state.sched[d]);
        if (l.length) found = { day: d, l: l[0] };
      }
      st.innerHTML = '<span class="pill warn">' + (today.length ? "Часовете за днес свършиха" : "Няма часове днес") + "</span>";
      $("subject").textContent = found ? found.l.name : "Няма въведена програма";
      $("detail").textContent = found ? DAYS[found.day] + ", " + fmt(found.l.start) : "";
      barWrap.hidden = true;
    }

    $("today").innerHTML = today.length ? today.map(l => {
      const cls = l === cur ? "cur" : (mins >= l.start + LESSON ? "done" : "");
      return '<li class="' + cls + '"><span class="t">' + fmt(l.start) + "–" + fmt(l.start + LESSON) + '</span><span class="s">' + esc(l.name) + "</span></li>";
    }).join("") : "";
  }

  // Програма
  const daySel = $("daySel");
  [1,2,3,4,5,6,0].forEach(d => daySel.add(new Option(DAYS[d], d)));
  daySel.value = new Date().getDay();
  const loadDay = () => { $("schedText").value = state.sched[daySel.value] || ""; };
  loadDay();
  daySel.addEventListener("change", loadDay);
  $("schedText").addEventListener("input", e => { state.sched[daySel.value] = e.target.value; save(); render(); });
  $("toggleSched").addEventListener("click", e => {
    const ed = $("schedEditor"); ed.hidden = !ed.hidden;
    e.target.textContent = ed.hidden ? "Редактирай програмата" : "Скрий редактора";
  });

  // Бележки: филтър по ключови думи (корени, за да хваща и „промени“, „заместничка“ и т.н.)
  const RX = /(промен\S*|замест\S*|кабинет\S*)/giu;
  function renderNotes() {
    const lines = state.notes.split(/\r?\n/).map(l => l.trim()).filter(l => l && l.match(RX));
    $("hits").innerHTML = lines.length
      ? lines.map(l => "<li>" + esc(l).replace(RX, "<mark>$1</mark>") + "</li>").join("")
      : '<li class="empty" style="border:0;background:none;padding:0">' + (state.notes ? "Няма важни редове в поставения текст." : "Все още няма поставен текст.") + "</li>";
  }
  const notes = $("notes");
  notes.value = state.notes;
  const onNotes = () => { state.notes = notes.value; save(); renderNotes(); };
  notes.addEventListener("input", onNotes);
  notes.addEventListener("paste", () => setTimeout(onNotes, 0));
  $("toggleNotes").addEventListener("click", e => {
    const b = $("notesBox"); b.hidden = !b.hidden;
    e.target.textContent = b.hidden ? "Постави текст" : "Скрий полето";
    if (!b.hidden) notes.focus();
  });
  $("clearNotes").addEventListener("click", () => { notes.value = ""; onNotes(); });

  renderNotes();
  render();
  setInterval(render, 1000);
})();
</script>
